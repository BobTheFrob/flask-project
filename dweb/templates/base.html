<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}{% endblock %} - DMedias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='icon.png') }}">
</head>

<body class="bg-dark text-light">
    <nav class="navbar navbar-expand-sm navbar-dark bg-black sticky-top border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fs-2" href="{{ url_for('main.index') }}"><img width="30" height="30"
            class="img-responsive rounded float-start mx-2"
            src="https://imgs.search.brave.com/VgBo9e5yrVE37YZFBxg_HjV01zPM0ljrEb8P05-GXJQ/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pLnBp/bmltZy5jb20vb3Jp/Z2luYWxzLzY1L2U4/L2YzLzY1ZThmMzhl/ZmEyMTllNjY2MmNl/MWU2YTNkNzFiMzI3/LmpwZw">
            DMedias
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse d-flex justify-content-between" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-sm-0">
                    <li class="nav-item me-2">
                        <a class="nav-link" href="{{ url_for('main.index') }}">Home</a>
                    </li>
                    <li class="nav-item me-2">
                        <a class="nav-link" href="{{ url_for('main.posts_page') }}">Anime</a>
                    </li>
                </ul>
                <ul class="navbar-nav mb-2 mb-sm-0 d-flex flex-row-reverse pe-5">
                    {% if g.user %}
                        <button class="btn btn-danger btn-sm" id="logout-btn">Logout</button>
                    {% else %}
                        <a class="btn btn-outline-light btn-sm" href="{{ url_for('auth.login_page') }}">Login</a>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <header class="mb-4">
            {% block header %}{% endblock %}
            <hr>
        </header>

        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block script %}{% endblock %}
</body>
</html>
